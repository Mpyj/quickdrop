[package]
name = "quickdrop-core"
version = "0.1.0"
edition = "2021"
description = "QuickDrop shared core (server, transfer, auth)"
authors = ["Parsa"]

[lib]
name = "quickdrop_core"
crate-type = ["lib"]

[dependencies]
# ============================================
# Async runtime
# ============================================
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1"

# ============================================
# Web server
# ============================================
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }

# ============================================
# Serialization
# ============================================
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

# ============================================
# Network
# ============================================
local-ip-address = "0.6"
if-addrs = "0.13"

# ============================================
# Utilities
# ============================================
rand = "0.9"
qrcode = "0.14"
image = "0.25"
uuid = { version = "1", features = ["v4", "fast-rng", "serde"] }
dirs = "5"
log = "0.4"