[package]
name = "quickdrop-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "quickdrop_core"
crate-type = ["lib"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
local-ip-address = "0.6"
rand = "0.9"
qrcode = "0.14"
image = "0.25"
uuid = { version = "1", features = ["v4", "fast-rng", "serde"] }
dirs = "5"