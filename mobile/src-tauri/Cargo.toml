[package]
name = "quickdrop-mobile"
version = "0.1.0"
description = "QuickDrop - Mobile"
authors = ["Parsa"]
edition = "2021"

[lib]
name = "quickdrop_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# BLE Plugin (با Android backend اختصاصی)
tauri-plugin-blec = "0.16"

# Shared Core
quickdrop-core = { path = "../../crates/quickdrop-core" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async
tokio = { version = "1", features = ["full"] }