[package]
name = "quickdrop-mobile"
version = "0.1.0"
description = "QuickDrop - Mobile"
authors = ["Parsa"]
edition = "2021"

[lib]
name = "quickdrop_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# Shared Core
quickdrop-core = { path = "../../crates/quickdrop-core" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async
tokio = { version = "1", features = ["full"] }

# Mobile-specific
[target.'cfg(target_os = "android")'.dependencies]
# بعداً: Bluetooth, Hotspot

# ============================================
# Android build settings
# ============================================
[package.metadata.android]
package-name = "com.parsa.quickdrop"
apk-name = "QuickDrop"
version-code = 1
version-name = "0.1.0"

[package.metadata.android.sdk]
min-sdk-version = 24      # Android 7.0
target-sdk-version = 34   # Android 14