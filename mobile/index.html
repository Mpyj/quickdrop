<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a14">
    <title>QuickDrop</title>
    <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
    <!-- ============ Screen: Loading ============ -->
    <div id="loading-screen" class="screen active">
        <div class="loader"></div>
        <p>در حال آماده‌سازی...</p>
    </div>

    <!-- ============ Screen: Home ============ -->
    <div id="home-screen" class="screen">
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">⚡</div>
                <div class="brand-text">
                    <h1>QuickDrop</h1>
                    <p>انتقال فایل روی شبکه</p>
                </div>
            </div>
            <button class="icon-btn" id="settings-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </header>

        <main class="content">
            <!-- Status Card -->
            <div class="status-card">
                <div class="status-icon">📡</div>
                <div class="status-info">
                    <div class="status-title">آماده برای انتقال</div>
                    <div class="status-subtitle" id="status-subtitle">در حال جستجو...</div>
                </div>
                <div class="status-pulse"></div>
            </div>

            <!-- Big Actions -->
            <div class="big-actions">
                <button class="big-action send" id="send-btn">
                    <div class="big-action-icon">📤</div>
                    <div class="big-action-content">
                        <div class="big-action-title">ارسال فایل</div>
                        <div class="big-action-desc">فایل رو به یه دستگاه دیگه بفرست</div>
                    </div>
                    <div class="big-action-arrow">←</div>
                </button>

                <button class="big-action receive" id="receive-btn">
                    <div class="big-action-icon">📥</div>
                    <div class="big-action-content">
                        <div class="big-action-title">دریافت فایل</div>
                        <div class="big-action-desc">فایل‌های ارسالی رو دریافت کن</div>
                    </div>
                    <div class="big-action-arrow">←</div>
                </button>
            </div>

            <!-- Info Card (کوچیک) -->
            <div class="info-mini">
                <div class="info-mini-row">
                    <span class="info-mini-label">IP:</span>
                    <span class="info-mini-value" id="local-ip">---.---.---.---</span>
                </div>
                <div class="info-mini-row">
                    <span class="info-mini-label">Pair Code:</span>
                    <span class="info-mini-value" id="pair-code">----</span>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            <span>QuickDrop v0.1.0</span>
        </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
