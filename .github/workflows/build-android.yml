name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            mobile/src-tauri -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - name: Install npm deps (root)
        run: npm install

      - name: Install npm deps (mobile)
        working-directory: mobile
        run: npm install

      - name: Build Frontend (mobile)
        working-directory: mobile
        run: npm run build

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Init Android
        working-directory: mobile
        run: cargo tauri android init

      # ========================================
      # 👈 تنظیم minSdkVersion روی 26
      # ========================================
      - name: Set minSdkVersion to 26
        working-directory: mobile
        run: |
          GRADLE_FILE="src-tauri/gen/android/app/build.gradle.kts"
          if [ ! -f "$GRADLE_FILE" ]; then
            GRADLE_FILE="src-tauri/gen/android/app/build.gradle"
          fi
          
          echo "Editing $GRADLE_FILE"
          
          # تغییر minSdk
          sed -i 's/minSdk = 24/minSdk = 26/g' "$GRADLE_FILE" 2>/dev/null || true
          sed -i 's/minSdkVersion 24/minSdkVersion 26/g' "$GRADLE_FILE" 2>/dev/null || true
          
          # چک کن
          grep -i "minSdk" "$GRADLE_FILE" || echo "minSdk not found, checking other files..."
          
          # اگه توی gradle.properties هست
          PROPS_FILE="src-tauri/gen/android/gradle.properties"
          if [ -f "$PROPS_FILE" ]; then
            echo "android.minSdkVersion=26" >> "$PROPS_FILE"
          fi

      - name: Generate Keystore
        working-directory: mobile
        run: |
          mkdir -p src-tauri/gen
          keytool -genkey -v \
            -keystore src-tauri/gen/quickdrop.keystore \
            -alias quickdrop \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass quickdrop123 \
            -keypass quickdrop123 \
            -dname "CN=QuickDrop, OU=Dev, O=QuickDrop, L=Tehran, ST=Tehran, C=IR"

      - name: Configure Signing in build.gradle
        working-directory: mobile
        run: |
          GRADLE_FILE="src-tauri/gen/android/app/build.gradle.kts"
          if [ ! -f "$GRADLE_FILE" ]; then
            GRADLE_FILE="src-tauri/gen/android/app/build.gradle"
          fi
          
          python3 - <<EOF
          with open("$GRADLE_FILE", "r") as f:
              content = f.read()
          
          signing_block = '''
              signingConfigs {
                  create("release") {
                      storeFile = file("../../quickdrop.keystore")
                      storePassword = "quickdrop123"
                      keyAlias = "quickdrop"
                      keyPassword = "quickdrop123"
                  }
              }
          '''
          
          content = content.replace("android {", "android {" + signing_block, 1)
          content = content.replace(
              "buildTypes {",
              '''buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }''',
              1
          )
          
          with open("$GRADLE_FILE", "w") as f:
              f.write(content)
          EOF

      - name: Build Signed Android APK
        working-directory: mobile
        run: |
          cargo tauri android build --apk --target aarch64

      - name: Find APK
        id: find_apk
        run: |
          SIGNED_APK=$(find mobile/src-tauri/gen/android -name "*release*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$SIGNED_APK" ]; then
            SIGNED_APK=$(find mobile/src-tauri/gen/android -name "*.apk" ! -name "*unsigned*" | head -n 1)
          fi
          echo "APK_PATH=$SIGNED_APK" >> $GITHUB_OUTPUT
          echo "Found APK: $SIGNED_APK"

      - name: Rename APK
        run: |
          mkdir -p output
          cp "${{ steps.find_apk.outputs.APK_PATH }}" "output/QuickDrop-${GITHUB_REF_NAME:-test}.apk"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickdrop-apk-${{ github.ref_name }}
          path: output/QuickDrop-*.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: output/QuickDrop-*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}